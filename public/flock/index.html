<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Name a hatchling and grow it through a ten-fight campaign.">
<meta name="flock-build" content="catalog-art-v1">
<title>Flock</title>
<style>
:root {
  --bg: #0e0c0b;
  --ink: #f4efe6;
  --muted: #b7ab9a;
  --gold: #e4c17a;
  --line: rgba(244, 239, 230, 0.16);
  --safe-t: env(safe-area-inset-top);
  --safe-b: env(safe-area-inset-bottom);
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
#app { height: 100dvh; height: 100svh; overflow: hidden; display: flex; flex-direction: column; transition: opacity .28s ease; }
#app.is-swapping { opacity: 0; }
.screen { flex: 1 1 auto; height: auto; min-height: 0; display: flex; flex-direction: column; }
.art-screen {
  position: relative; flex: 1; min-height: 0; margin: 0;
  background: #1a1410 center 20% / cover no-repeat;
}
.art-screen::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(14,12,11,.15) 20%, rgba(14,12,11,.2) 48%, rgba(14,12,11,.92) 100%);
}
.veil { position: relative; z-index: 1; margin-top: auto; padding: 16px 16px calc(14px + var(--safe-b)); }
.kicker { margin: 0 0 4px; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--gold); }
h1 { font-family: Palatino, "Iowan Old Style", Georgia, serif; font-weight: 560; font-size: 34px; line-height: 1; margin: 0 0 6px; }
.blurb { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.35; }
.hint {
  position: relative; z-index: 2; margin: calc(8px + var(--safe-t)) 12px 0;
  padding: 8px 10px; border-radius: 10px; background: rgba(14,12,11,.72);
  color: #f3e6c8; font-size: 13px; line-height: 1.35;
}
.go, .dock button, .mini {
  border: 0; border-radius: 14px; background: var(--gold); color: #1a140c; font-weight: 680;
  min-height: 48px; padding: 12px 16px;
}
.go { width: 100%; font-size: 17px; }
.nav {
  position: absolute; z-index: 2; top: 42%; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(14,12,11,.45); font-size: 26px; line-height: 1;
}
.nav.prev { left: 10px; }
.nav.next { right: 10px; }
.dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.dots i, .pips i { width: 7px; height: 7px; border-radius: 50%; background: rgba(244,239,230,.28); display: block; }
.dots i.on, .pips i.on { background: var(--gold); }
.name-wrap { position: absolute; z-index: 2; left: 16px; right: 16px; top: 16%; }
.name-wrap input {
  width: 100%; margin: 8px 0 12px; padding: 14px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(14,12,11,.72); font-size: 22px;
}
.sheet {
  position: relative; z-index: 1; margin-top: auto;
  padding: 14px 14px calc(12px + var(--safe-b));
  background: linear-gradient(180deg, transparent, rgba(14,12,11,.94) 28%);
}
.row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lv { color: var(--gold); font-size: 13px; letter-spacing: .08em; }
.xp { height: 6px; border-radius: 99px; background: rgba(244,239,230,.16); overflow: hidden; margin: 8px 0 10px; }
.xp i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left center; transform: scaleX(0); }
.runes, .squad-row, .links { display: flex; gap: 8px; }
.runes button, .links button {
  flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(14,12,11,.35); color: var(--ink); font-size: 13px;
}
.runes button.on { border-color: var(--gold); color: var(--gold); }
.links { margin-top: 8px; }
.links button { background: transparent; }
.battle { position: relative; flex: 1 1 auto; min-height: 0; height: auto; display: grid; grid-template-rows: auto minmax(0,1.05fr) minmax(0,.95fr) auto; padding: calc(6px + var(--safe-t)) 10px calc(8px + var(--safe-b)); gap: 6px; }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 28px; }
.top b { font-size: 13px; letter-spacing: .06em; }
.top span, .status { color: var(--muted); font-size: 12px; }
.status { min-height: 16px; margin: 0; }
.card { position: relative; min-height: 0; border-radius: 16px; overflow: hidden; background: #221c16; }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
.card .tag {
  position: absolute; left: 10px; top: 8px; font-size: 13px; font-weight: 680;
  text-shadow: 0 1px 6px #000;
}
.life { position: absolute; left: 10px; right: 10px; bottom: 8px; height: 8px; border-radius: 99px; background: rgba(0,0,0,.45); overflow: hidden; }
.life i { display: block; height: 100%; width: 100%; transform-origin: left center; background: #d4564e; }
.life.wide { right: auto; }
.card.shell { box-shadow: inset 0 0 0 2px #d08958; }
img.tint-glacielle { filter: hue-rotate(168deg) saturate(1.3); }
img.tint-stormveil { filter: hue-rotate(205deg) brightness(1.12); }
img.tint-nyxshade { filter: hue-rotate(255deg) saturate(.7) brightness(.78); }
.card.provisional { box-shadow: inset 0 0 0 2px rgba(228,193,122,.85); }
.card.lunge { animation: lunge .22s ease; }
.bench { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; }
.bench span {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(244,239,230,.7);
  overflow: hidden; background: #000; display: block;
}
.bench img { width: 100%; height: 100%; object-fit: cover; }
.dock { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.dock button { font-size: 15px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dock button small { display: block; font-weight: 560; font-size: 10px; opacity: .75; }
.dock button:disabled { opacity: .4; }
.pop {
  position: absolute; left: 50%; top: 42%; font-family: Palatino, Georgia, serif;
  font-size: 32px; font-weight: 700; text-shadow: 0 2px 8px #000; animation: float .7s ease forwards; pointer-events: none;
}
.spark { position: absolute; left: 50%; top: 42%; width: 7px; height: 7px; border-radius: 50%; background: #ffe7b0; pointer-events: none; animation: spark .65s ease-out forwards; }
.spark.evo { background: #fff6d8; width: 8px; height: 8px; }
.spark.crit { background: #fff; box-shadow: 0 0 8px #ffe08a; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
.card.struck { animation: struck .2s linear; }
@keyframes struck { 0% { filter: brightness(1.85); } 100% { filter: none; } }
.card.shield { box-shadow: inset 0 0 0 3px #7eb6ff; }
.card.burning { outline: 2px solid #e26a32; outline-offset: -5px; }
.card.frozen { outline: 2px solid #d5f3ff; outline-offset: -5px; }
.pop.crit { color: #ffe08a; font-size: 40px; }
body.shake { animation: shake .28s linear; }
@keyframes float { to { transform: translate(-50%, -46px); opacity: 0; } }
@keyframes lunge { 50% { transform: translateY(-8px) scale(1.03); } }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.flash { position: absolute; inset: 0; background: #fff6e4; animation: flash .7s ease forwards; pointer-events: none; z-index: 4; }
.flash.crit { background: #fff1cc; animation-duration: .32s; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.screen, .grid-screen, .reward { animation: rise .34s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
button.daily-chip { display: block; width: calc(100% - 24px); text-align: left; border: 0; }
.goal { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 12px 0; font-size: 16px; }
.goal.done { color: var(--gold); }
.chest-stage { align-items: stretch; justify-content: center; }
.chest { width: 180px; height: 150px; position: relative; margin: 18px auto; perspective: 400px; }
.chest .box, .chest .lid { position: absolute; left: 22px; right: 22px; border-radius: 12px; box-shadow: inset 0 0 0 3px var(--gold); }
.chest .box { bottom: 10px; height: 78px; background: linear-gradient(180deg, #8d5a32, #3d2414); }
.chest .lid { bottom: 74px; height: 40px; background: linear-gradient(180deg, #d09a58, #6a3c1e); transform-origin: center top; transition: transform .55s ease; }
.chest.open .lid { transform: translateY(-6px) rotateX(-78deg); }
.chest .glow { position: absolute; left: 40px; right: 40px; bottom: 70px; height: 8px; border-radius: 50%; background: #fff6d0; opacity: 0; filter: blur(2px); }
.chest.open .glow { height: 86px; opacity: .95; transition: height .35s ease .2s, opacity .35s ease .2s; }
button.danger { margin-top: 10px; background: transparent; color: #e7b2a8; border: 1px solid rgba(228, 120, 100, .5); }
.reward, .evo, .grid-screen { flex: 1 1 auto; height: auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: calc(12px + var(--safe-t)) 14px calc(12px + var(--safe-b)); }
.reward .xp { height: 10px; }
.grid { flex: 1 1 auto; height: 0; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile {
  position: relative; border: 0; padding: 0; border-radius: 12px; overflow: hidden; background: #1b1612;
  height: 100%; min-height: 0;
}
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile.silhouette img { filter: brightness(0) contrast(1.15); opacity: .85; }
.tile.on { box-shadow: inset 0 0 0 2px var(--gold); }
.tile b { position: absolute; left: 6px; right: 6px; bottom: 6px; font-size: 11px; text-align: left; text-shadow: 0 1px 4px #000; }
.map { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 12px; }
.node {
  border-radius: 12px; border: 1px solid var(--line); background: transparent; min-height: 46px; text-align: left; padding: 8px 10px; font-size: 13px;
}
.node.done { border-color: var(--gold); color: var(--gold); }
.node.now { background: var(--gold); color: #1a140c; border-color: var(--gold); }
.back { position: absolute; z-index: 3; top: calc(8px + var(--safe-t)); left: 10px; border: 0; background: rgba(14,12,11,.55); color: var(--ink); border-radius: 999px; min-height: 36px; padding: 6px 12px; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
@media (prefers-reduced-motion: reduce) {
  .pop, .card.lunge, body.shake, .flash, .spark, .card.struck, .screen, .grid-screen, .reward { animation: none; }
  #app { transition: none; }
}
</style>
</head>
<body>
<main id="app"></main>
<script src="./catalog-runtime.js"></script>
<script>
const KEY = "flock.v3";
const HINTS = {
  pick: "Выбери своего дракона. Он будет расти.",
  name: "Дай ему имя. Оно останется с ним.",
  den: "Руна меняет роль: ударник, танк или лекарь.",
  battle: "Три кнопки: удар, умение или смена.",
  reward: "Опыт и иногда дубликат. На 5 и 10 уровне — эволюция.",
  evolve: "Он изменился: другой вид и новое умение.",
  flock: "Открытых можно взять в тройку. Тёмные ещё не вылупились.",
  map: "Десять боёв. Десятый — босс. Проигрыш не сбрасывает путь.",
  daily: "Три цели на сегодня. Сундук открывается, когда все три готовы."
};
const RUNES = {
  fury: { name: "Striker", line: "Harder hits, thinner life." },
  ward: { name: "Tank", line: "Thicker life, softer hits." },
  life: { name: "Healer", line: "A steadier life between the other two." }
};
const STYLE_LINE = {
  burst: "Skill is one heavy blow.",
  bulwark: "Skill hits, then raises a shield.",
  mend: "Skill mends you, then bites.",
  burn: "Skill leaves a burn that ticks.",
  shell: "Skill hardens your hide.",
  flurry: "Skill strikes twice.",
  frost: "Skill freezes their next action.",
  arc: "Skill jumps to the next enemy.",
  leech: "Skill gives you part of the damage."
};
const STYLE_WORD = { burst: "Heavy", bulwark: "Shield", mend: "Mend", burn: "Burn", shell: "Hide", flurry: "Twice", frost: "Freeze", arc: "Arc", leech: "Leech" };
let SPECIES = [];
let BY = {};
let UNLOCK_AT = {};
let WAVES = [];
const CAMPAIGN_WAVES = [
  ["ashmaw"],
  ["ashmaw", "ashmaw"],
  ["ashmaw", "pyrestone"],
  ["pyrestone", "pyrestone"],
  ["pyrestone", "scorchlane"],
  ["scorchlane", "ashmaw"],
  ["scorchlane", "pyrestone", "ashmaw"],
  ["pyrestone", "scorchlane"],
  ["scorchlane", "scorchlane"],
  ["scorchlane"]
];

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const app = document.querySelector("#app");
let state = load();
let battle = null;
let lock = false;
let audioCtx = null;
let resetArmed = false;

function load() {
  const blank = { v: 3, partnerId: null, partnerName: "", hints: {}, wins: 0, squad: [], owned: {} };
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw && raw.v === 3) {
      if (raw.sound === false) blank.sound = false;
      if (raw.partnerId && raw.owned?.[raw.partnerId]) return raw;
    }
  } catch { /* fresh */ }
  return blank;
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
const DAILY_GOALS = [
  { key: "wins", need: 2, label: "Win 2 fights" },
  { key: "skills", need: 3, label: "Use a skill 3 times" },
  { key: "switches", need: 1, label: "Switch a fighter" }
];
function todayKey() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function daily() {
  const day = todayKey();
  if (!state.daily || state.daily.day !== day) {
    state.daily = { day, wins: 0, skills: 0, switches: 0, claimed: false };
  }
  return state.daily;
}
function dailyReady(d) {
  return DAILY_GOALS.every((goal) => (d[goal.key] || 0) >= goal.need);
}
function bumpDaily(key) {
  const row = daily();
  if (row.claimed) return;
  row[key] = (row[key] || 0) + 1;
  save();
}
function spec(id) { return BY[id]; }
function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&" + "amp;")
    .replaceAll("<", "&" + "lt;")
    .replaceAll(">", "&" + "gt;")
    .replaceAll('"', "&" + "quot;")
    .replaceAll("'", "&" + "#39;");
}
function cleanName(raw) {
  return String(raw || "").replace(/[^\p{L}\p{N} '\-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 16);
}
function stageFor(level) { return level >= 10 ? 3 : level >= 5 ? 2 : 1; }
function xpNeed(level) { return level >= 10 ? 0 : 30 + level * 10; }
function maxHp(rune, level) {
  const stage = stageFor(level);
  const base = { fury: 74, ward: 116, life: 92 }[rune];
  const growth = { fury: 6, ward: 10, life: 7 }[rune];
  const bloom = { fury: 8, ward: 14, life: 10 }[rune];
  return base + (level - 1) * growth + (stage - 1) * bloom;
}
function strike(rune, level) {
  const stage = stageFor(level);
  const base = { fury: 18, ward: 11, life: 13 }[rune];
  const growth = { fury: 2, ward: 1, life: 1 }[rune];
  const bloom = { fury: 6, ward: 3, life: 4 }[rune];
  return base + (level - 1) * growth + (stage - 1) * bloom;
}
function skillName(id, level) { return spec(id).skills[stageFor(level) - 1]; }
function artOf(id, level) { return FlockCatalog.artFor(BY, id, level); }
function titleOf(id) {
  if (id === state.partnerId && state.partnerName) return state.partnerName;
  return spec(id).name;
}
function ownedRune(id) { return state.owned[id]?.rune || spec(id).rune; }
function ownedLevel(id) { return state.owned[id]?.level || 1; }
function grantXp(level, xp, amount) {
  let lv = level, cur = xp, left = amount;
  const evolutions = [];
  while (left > 0 && lv < 10) {
    const need = xpNeed(lv);
    if (cur + left < need) { cur += left; left = 0; break; }
    left -= need - cur;
    const before = stageFor(lv);
    lv += 1;
    cur = 0;
    const after = stageFor(lv);
    if (after !== before) evolutions.push({ level: lv, stage: after });
  }
  if (lv >= 10) { lv = 10; cur = 0; }
  return { level: lv, xp: cur, evolutions };
}
function roll(amount) {
  const swing = 0.9 + Math.random() * 0.22;
  return { dealt: Math.max(1, Math.round(amount * swing)), crit: swing >= 1.08 };
}
function hit(target, amount) {
  let dealt = amount;
  if (target.shield) {
    dealt = Math.max(1, Math.round(amount * 0.42));
    target.shield = false;
  } else if (target.shell) {
    dealt = Math.max(1, Math.round(amount * 0.7));
    target.shell = false;
  }
  target.hp = Math.max(0, target.hp - dealt);
  return dealt;
}
function heal(target, amount) {
  const before = target.hp;
  target.hp = Math.min(target.max, target.hp + amount);
  return target.hp - before;
}
function actOn(actor, target, allies, foes, kind) {
  if (kind === "skill" && actor.cd > 0) kind = "attack";
  const events = [];
  const strikeAt = (victim, amount, splash) => {
    if (!victim || victim.hp <= 0) return 0;
    const swung = roll(amount);
    const dealt = hit(victim, swung.dealt);
    events.push({ type: "hit", uid: victim.uid, amount: dealt, crit: swung.crit, splash: !!splash });
    return dealt;
  };
  if (kind === "skill") {
    actor.cd = 2;
    const amp = 1 + (stageFor(actor.level) - 1) * 0.12;
    const power = strike(actor.rune, actor.level) * amp;
    const style = spec(actor.id).style;
    const note = {
      burst: "Тяжёлый удар.",
      bulwark: "Щит поднят.",
      mend: "Лечит.",
      burn: "Горит.",
      shell: "Шкура твердеет.",
      flurry: "Два удара.",
      frost: "Замер.",
      arc: "Дуга.",
      leech: "Пьёт силу."
    }[style];
    if (style === "burst") strikeAt(target, Math.round(power * 2.05));
    else if (style === "bulwark") {
      strikeAt(target, Math.max(4, Math.round(power * 0.75)));
      actor.shield = true;
      events.push({ type: "shield", uid: actor.uid });
    } else if (style === "mend") {
      events.push({ type: "heal", uid: actor.uid, amount: heal(actor, Math.round(actor.max * 0.28)) });
      const other = allies.filter((a) => a !== actor && a.hp > 0 && a.hp < a.max).sort((a, b) => a.hp / a.max - b.hp / b.max)[0];
      if (other) {
        const extra = heal(other, Math.round(actor.max * 0.14));
        if (extra) events.push({ type: "heal", uid: other.uid, amount: extra });
      }
      strikeAt(target, Math.max(3, Math.round(power * 0.4)));
    } else if (style === "burn") {
      strikeAt(target, Math.round(power * 0.7));
      target.burn = Math.max(2, Math.round(power * 0.26));
      target.burnLeft = 2;
    } else if (style === "shell") {
      strikeAt(target, Math.round(power * 0.85));
      actor.shell = true;
      events.push({ type: "shield", uid: actor.uid });
    } else if (style === "flurry") {
      strikeAt(target, Math.round(power * 0.62));
      strikeAt(target, Math.round(power * 0.62));
    } else if (style === "frost") {
      strikeAt(target, Math.round(power * 0.75));
      target.frozen = 1;
    } else if (style === "arc") {
      strikeAt(target, Math.round(power * 0.95));
      const next = (foes || []).find((f) => f !== target && f.hp > 0);
      if (next) strikeAt(next, Math.round(power * 0.45), true);
    } else {
      const before = target.hp;
      const dealt = strikeAt(target, Math.round(power * 1.15));
      const sipped = heal(actor, Math.round((before - target.hp) * 0.5));
      if (sipped) events.push({ type: "heal", uid: actor.uid, amount: sipped });
      void dealt;
    }
    if (note) events.push({ type: "note", text: note });
    return { kind, events };
  }
  strikeAt(target, strike(actor.rune, actor.level));
  if (actor.cd > 0) actor.cd -= 1;
  return { kind: "attack", events };
}
function wait(ms) { return new Promise((resolve) => setTimeout(resolve, reduced ? 16 : ms)); }
function cue(kind) {
  if (state.sound === false) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = audioCtx || new Ctx();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    const tone = (freq, dur, type, peak, delay) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now + delay);
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(peak, now + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + delay); osc.stop(now + delay + dur + 0.02);
    };
    const noise = (dur, peak, hp) => {
      const count = Math.floor(audioCtx.sampleRate * dur);

        <div class="veil">
          <p class="kicker">Evolution</p>
          <h1>${esc(state.partnerName)}</h1>
          <p class="blurb">New skill · ${esc(skillName(id, evo.level))}</p>
          <button class="go" type="button">This is mine</button>
        </div>
      </div>
    </section>`);
  cue("evolve");
  buzz([20, 40, 20, 40, 30]);
  burst(null, "evo");
  setTimeout(() => {
    const node = document.getElementById("evo-art");
    if (node) node.style.backgroundImage = `url('${to.src}')`;
  }, reduced ? 20 : 420);
  app.querySelector(".go").onclick = () => { dismiss("evolve"); openDen(); };
}
function openDaily() {
  const row = daily();
  const ready = dailyReady(row) && !row.claimed;
  const goals = DAILY_GOALS.map((goal) => {
    const have = Math.min(row[goal.key] || 0, goal.need);
    return `<div class="goal ${have >= goal.need ? "done" : ""}"><span>${esc(goal.label)}</span><b>${have}/${goal.need}</b></div>`;
  }).join("");
  show(`
    ${hint("daily")}
    <section class="grid-screen">
      <p class="kicker">Today</p>
      <h1>${row.claimed ? "Chest opened" : "Three marks"}</h1>
      <p class="sub">${row.claimed ? "A new chest tomorrow." : "All three open the chest once."}</p>
      ${goals}
      ${ready ? '<button class="go" type="button" data-open style="margin-top:16px">Open the chest</button>' : ""}
      <button class="mini" type="button" data-back style="margin-top:10px">Den</button>
    </section>`);
  app.querySelector("[data-open]")?.addEventListener("click", () => { dismiss("daily"); openChest(); });
  app.querySelector("[data-back]").onclick = () => openDen();
}
function openChest() {
  const row = daily();
  if (!dailyReady(row) || row.claimed || !state.partnerId) { openDaily(); return; }
  show(`
    <section class="grid-screen chest-stage">
      <p class="kicker">Daily chest</p>
      <div class="chest" id="chest"><div class="glow"></div><div class="lid"></div><div class="box"></div></div>
      <h1 data-chest-title>…</h1>
      <p class="blurb" data-chest-line>The lid is still shut.</p>
      <button class="go" type="button" disabled>Continue</button>
    </section>`, false);
  cue("win");
  const chest = document.getElementById("chest");
  setTimeout(() => {
    if (!chest) return;
    chest.classList.add("open");
    burst(null, "evo", chest);
    const owned = state.owned[state.partnerId];
    const beforeStage = stageFor(owned.level);
    let evolutions = [];
    let line = "Already fully grown. The ember fades.";
    if (owned.level < 10) {
      const gained = grantXp(owned.level, owned.xp, 36);
      owned.level = gained.level;
      owned.xp = gained.xp;
      evolutions = gained.evolutions;
      line = "+36 XP";
    }
    row.claimed = true;
    save();
    const title = app.querySelector("[data-chest-title]");
    const blurb = app.querySelector("[data-chest-line]");
    if (title) title.textContent = state.partnerName;
    if (blurb) blurb.textContent = line;
    const btn = app.querySelector(".go");
    if (!btn) return;
    btn.disabled = false;
    btn.onclick = () => {
      if (evolutions.length) openEvolve(evolutions[0], beforeStage);
      else openDen();
    };
  }, reduced ? 20 : 480);
}
function openSettings() {
  const on = state.sound !== false;
  show(`
    <section class="grid-screen">
      <p class="kicker">Settings</p>
      <h1>Camp</h1>
      <p class="sub">Звук можно выключить. Сброс стирает путь и стаю, звук остаётся. Вибрация на iPhone часто молчит сама.</p>
      <button class="go" type="button" data-sound>${on ? "Sound on" : "Sound off"}</button>
      <button class="go danger" type="button" data-reset>${resetArmed ? "Tap again to reset" : "Reset progress"}</button>
      <button class="mini" type="button" data-back style="margin-top:10px">Den</button>
    </section>`);
  app.querySelector("[data-sound]").onclick = () => {
    resetArmed = false;
    state.sound = state.sound === false;
    save();
    if (state.sound !== false) cue("hit");
    openSettings();
  };
  app.querySelector("[data-reset]").onclick = () => {
    if (!resetArmed) {
      resetArmed = true;
      openSettings();
      return;
    }
    const sound = state.sound;
    state = { v: 3, partnerId: null, partnerName: "", hints: {}, wins: 0, squad: [], owned: {}, sound };
    battle = null;
    resetArmed = false;
    save();
    openPick(0);
  };
  app.querySelector("[data-back]").onclick = () => { resetArmed = false; state.partnerId ? openDen() : openPick(0); };
}
async function bootCatalog() {
  app.innerHTML = '<section class="grid-screen"><p class="sub" role="status">Loading your flock…</p></section>';
  try {
    const response = await fetch("catalog.json", { cache: "no-cache" });
    if (!response.ok) throw new Error("Catalog could not be loaded");
    const catalog = await response.json();
    const roster = FlockCatalog.buildRoster(catalog);
    SPECIES = roster.species;
    BY = roster.by;
    UNLOCK_AT = roster.unlockAt;
    // Keep missing dragons out of battles as well as collection and rewards.
    WAVES = CAMPAIGN_WAVES.map((wave) => {
      const ready = wave.filter((id) => BY[id]);
      return ready.length ? ready : [SPECIES.find((dragon) => dragon.starter).id];
    });
    state = FlockCatalog.reconcileSave(state, roster);
    boot();
  } catch (error) {
    app.innerHTML = '<section class="grid-screen"><h1>Flock is resting</h1><p class="sub">We could not load the dragon collection.</p><button class="go" type="button">Try again</button></section>';
    app.querySelector(".go").onclick = bootCatalog;
    console.error(error);
  }
}
bootCatalog();
</script>
</body>
</html>
