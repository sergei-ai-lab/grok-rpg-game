<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06070b">
<title>DragonVerse</title>
<style>
:root{--gold:#f4c76a;--gold2:#c9902e;--ink:#0b0d16;--txt:#fbf4e4;--dim:#a9a191;--red:#e2403a;--grn:#3fcf5c;--blu:#3d8bff;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--txt);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{-webkit-user-drag:none;pointer-events:none}
#app{position:fixed;left:0;top:0;overflow:hidden;background:#000;transform-origin:0 0;font-size:var(--fs,14px)}
.scr{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.abs{position:absolute}
.t-outline{text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000,0 2px 4px rgba(0,0,0,.8)}
.serif{font-family:Georgia,"Times New Roman",serif}
/* top chrome */
.navbtns{position:absolute;left:calc(1.2em + var(--sl));top:.5em;display:flex;gap:.2em;z-index:20}
.navbtns button{height:2.6em;min-width:3.4em;padding:0 .8em;display:grid;place-items:center;font-size:1em;font-weight:900;color:var(--gold);
 background:linear-gradient(#2a2216,#120e08);border:2px solid #8a6a32;clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);box-shadow:inset 0 0 0 1px #000}
.navbtns button.i{clip-path:none;min-width:2.6em;padding:0;border-radius:.2em}
.navbtns .ttl{align-self:center;margin-left:.5em;font-size:1.35em;font-weight:800;color:#fff1cf}
.res{position:absolute;right:calc(1.2em + var(--sr));top:.55em;display:flex;gap:.6em;z-index:20}
.res .p{display:flex;align-items:center;height:2.1em;padding:0 .3em 0 .2em;border-radius:1em;background:linear-gradient(90deg,rgba(0,0,0,.75),rgba(30,24,16,.8));border:1px solid rgba(244,199,106,.35);font-weight:800;font-size:1em;gap:.35em}
.res .p i{font-style:normal;font-size:1.2em;width:1.4em;text-align:center}
.res .p b{min-width:3.2em;text-align:right}
.res .p .pl{width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#5ce97a,#1e9b3a);color:#fff;font-weight:900;font-size:.95em}
/* buttons */
.gold{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.4em;font-weight:900;color:#3a2200;font-size:1.15em;padding:.55em 1.6em;
 background:linear-gradient(#ffe9a3,#f2c057 45%,#d18f22);border:2px solid #fff2bf;border-radius:.35em;box-shadow:0 .25em 0 #7a4a0e,0 .5em 1em rgba(0,0,0,.5),inset 0 0 0 1px #b07418;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.gold:active{transform:translateY(.2em);box-shadow:0 .05em 0 #7a4a0e}
.gold:disabled{filter:grayscale(1) brightness(.6)}
.blue{display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:1.15em;padding:.55em 2em;color:#fff;background:linear-gradient(#4aa0ff,#1957c9);border:2px solid #bfe0ff;border-radius:.35em;box-shadow:0 .25em 0 #0d2d6a}
.dark{display:inline-flex;align-items:center;justify-content:center;gap:.3em;font-weight:800;padding:.45em 1em;background:linear-gradient(#2c2f3d,#14161f);border:1px solid #6d6247;border-radius:.35em;color:#f2e6c8}
.dark:disabled{opacity:.4}
/* element marks */
.mk{display:inline-grid;place-items:center;width:1.45em;height:1.45em;font-size:1em;font-weight:900;line-height:1;filter:drop-shadow(0 1px 1px #000)}
.mk.red{color:#ff3b30}.mk.blue{color:#2fa0ff}.mk.green{color:#3fe06a}.mk.force{color:#ffd23a}
/* portrait card (like IMR) */
.pc{position:relative;aspect-ratio:4/5;border-radius:.3em;overflow:hidden;border:2px solid #9aa2b5;background:#1a1d28;box-shadow:0 .2em .4em rgba(0,0,0,.6)}
.pc .ph{position:absolute;inset:0;background-repeat:no-repeat}
.pc .ph.cover{background-size:cover;background-position:50% 18%}
.pc.R{border-color:#8fb3d9;background:linear-gradient(#2c4c78,#14243b)}.pc.E{border-color:#c290ff;background:linear-gradient(#55307d,#22143a)}.pc.L{border-color:#ffcf5a;background:linear-gradient(#8a5e14,#3d2606)}
.pc .lv{position:absolute;right:.15em;top:0;font-weight:900;font-size:1.25em;color:#fff;-webkit-text-stroke:.04em #000;text-shadow:0 2px 2px #000}
.pc .mk{position:absolute;left:.1em;top:.1em}
.pc .st{position:absolute;left:.1em;bottom:.1em;display:grid;place-items:center;width:1.8em;height:1.8em;font-weight:900;font-size:.95em;color:#fff;background:radial-gradient(#d85cff,#7a1fb5);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);text-shadow:0 1px 1px #000}
.pc .stars{position:absolute;left:.15em;bottom:.05em;color:#ffd23a;font-size:.95em;letter-spacing:-.1em;text-shadow:0 1px 1px #000}
.pc .nm{position:absolute;left:0;right:0;bottom:0;padding:.9em .2em .15em;text-align:center;font-size:.72em;font-weight:800;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.gray .ph{filter:grayscale(1) brightness(.7)}.pc.gray{border-color:#666;background:#2a2c33}
.pc.sel{outline:.18em solid #59ff7a;outline-offset:-.18em;box-shadow:0 0 .8em #39ff6a}
.pc .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6em;background:rgba(0,0,0,.35)}
.pc .badge{position:absolute;right:.15em;bottom:.15em;font-size:.65em;font-weight:900;padding:.1em .35em;border-radius:.3em;background:#2fbf4f}
/* hub */
.hub .bg{filter:saturate(1.15)}
.hub .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.6)),linear-gradient(rgba(0,0,0,.45),transparent 18%,transparent 78%,rgba(0,0,0,.7))}
.bld{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:5}
.bld .ic{width:3.6em;height:3.6em;border-radius:50%;display:grid;place-items:center;font-size:2em;background:radial-gradient(circle at 50% 40%,rgba(255,220,140,.35),rgba(0,0,0,.55) 70%);border:2px solid rgba(244,199,106,.7);box-shadow:0 0 1.2em rgba(255,190,90,.45);animation:float 3s ease-in-out infinite}
.bld .lb{margin-top:.25em;font-weight:900;font-size:1.05em;padding:.1em .6em;background:linear-gradient(90deg,transparent,rgba(0,0,0,.65) 20%,rgba(0,0,0,.65) 80%,transparent)}
.bld .dot,.dotr{position:absolute;top:.2em;right:.2em;width:.75em;height:.75em;border-radius:50%;background:#ff2d2d;box-shadow:0 0 0 2px #000}
.bld.lock .ic{filter:grayscale(1) brightness(.6)}
@keyframes float{50%{transform:translateY(-.35em)}}
.avatar{position:absolute;left:calc(1em + var(--sl));top:.5em;display:flex;align-items:center;gap:.5em;z-index:20}
.avatar .pic{position:relative;width:4.4em;height:4.4em;border-radius:50%;border:3px solid #b07cff;background:#222 center/170% no-repeat;box-shadow:0 0 .8em #7a3cff}
.avatar .pic b{position:absolute;bottom:-.4em;left:50%;transform:translateX(-50%);font-size:.85em;background:#2a1e3e;border:1px solid #b07cff;border-radius:.6em;padding:0 .4em}
.avatar .pw{display:flex;align-items:center;gap:.3em;font-weight:900;font-size:1.3em;background:linear-gradient(90deg,rgba(0,0,0,.8),transparent);padding:.15em 1.4em .15em .5em}
.lcol{position:absolute;left:calc(1.3em + var(--sl));top:6.5em;display:flex;flex-direction:column;gap:.6em;z-index:20}
.lcol button{position:relative;width:2.8em;height:2.8em;border-radius:50%;background:rgba(10,12,20,.75);border:1px solid rgba(255,255,255,.2);font-size:1.25em}
.rgrid{position:absolute;right:calc(1.4em + var(--sr));top:4.2em;display:grid;grid-template-columns:repeat(2,4.6em);gap:.4em .3em;z-index:20}
.rgrid button{position:relative;display:flex;flex-direction:column;align-items:center;font-size:.72em;font-weight:900}
.rgrid .e{width:3em;height:3em;display:grid;place-items:center;font-size:2.2em;transform:rotate(45deg);border-radius:.3em;background:linear-gradient(135deg,#6a3fd1,#2a1458);border:2px solid #e7c26a;box-shadow:0 .2em .4em rgba(0,0,0,.6)}
.rgrid .e span{transform:rotate(-45deg);font-size:.5em}
.rgrid small{margin-top:.25em;font-size:1.1em;white-space:nowrap;max-width:6.5em;overflow:hidden;text-overflow:ellipsis}
.botbar{position:absolute;left:0;right:0;bottom:0;height:5.2em;display:flex;align-items:flex-end;padding:0 calc(1em + var(--sr)) .4em calc(1em + var(--sl));z-index:20;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.bigl,.bigr{position:relative;height:3.3em;display:flex;align-items:center;font-weight:900;font-size:1.25em}
.bigl{padding:0 2.2em 0 3.6em;background:linear-gradient(90deg,#1b4ec2,#2f74ff 70%,transparent);clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%);border-radius:1.6em 0 0 1.6em}
.bigr{padding:0 3.8em 0 2em;background:linear-gradient(270deg,#8c2a10,#d0561e 70%,transparent);clip-path:polygon(8% 0,100% 0,100% 100%,8% 100%,0 50%);border-radius:0 1.6em 1.6em 0;color:#ffe7c9}
.bigl .em,.bigr .em{position:absolute;top:50%;transform:translateY(-50%) rotate(45deg);width:3.2em;height:3.2em;display:grid;place-items:center;border:3px solid #e6c16a;border-radius:.4em;font-size:1em}
.bigl .em{left:-.2em;background:linear-gradient(135deg,#2c3c8a,#101a44)}.bigr .em{right:-.2em;background:linear-gradient(135deg,#6a2a10,#2d0f04)}
.bigl .em span,.bigr .em span{transform:rotate(-45deg);font-size:1.4em}
.icorow{flex:1;display:flex;justify-content:center;gap:1.2em;padding-bottom:.1em}
.icorow button{position:relative;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:.85em}
.icorow .c{width:3.1em;height:3.1em;border-radius:50%;display:grid;place-items:center;font-size:1.7em;background:radial-gradient(circle at 50% 35%,#3e5fae,#14224a);border:2px solid #a9c4ff;box-shadow:0 .2em .4em rgba(0,0,0,.6)}
.quest{position:absolute;left:calc(5.5em + var(--sl));bottom:5.6em;z-index:20;display:flex;align-items:center;gap:.6em;font-weight:800;font-size:1.05em;background:linear-gradient(90deg,rgba(60,40,10,.85),transparent);padding:.35em 2em .35em .4em;border-radius:2em 0 0 2em;max-width:45%}
.quest .sc{font-size:1.8em}
.idle{position:absolute;right:calc(2em + var(--sr));bottom:6em;z-index:20;display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:.95em}
.idle .ch{font-size:3em;filter:drop-shadow(0 0 .3em #ffcd52)}
.idle.full .ch{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.15em) rotate(-5deg)}}
.leader{position:absolute;left:50%;bottom:4.8em;transform:translateX(-50%);height:66%;z-index:4;display:flex;align-items:flex-end}
.leader img{height:100%;object-fit:contain;filter:drop-shadow(0 0 1.5em rgba(255,140,40,.4));animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
/* panels */
.panel{background:linear-gradient(#141826,#0b0d16);border:2px solid #7b6232;box-shadow:0 0 0 1px #000,0 1em 2em rgba(0,0,0,.6)}
.ov{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.pop{position:relative;min-width:24em;max-width:80%;max-height:88%;overflow:auto;padding:1em 1.2em}
.pop .x{position:absolute;right:.5em;top:.3em;font-size:1.8em;color:var(--gold);font-weight:300}
.pop h3{margin:0 0 .3em;font-size:1.5em}
.sep{height:2px;background:linear-gradient(90deg,transparent,#c9a14f,transparent);margin:.5em 0}
.toast{position:absolute;left:50%;top:15%;transform:translateX(-50%);z-index:99;background:rgba(0,0,0,.85);border:1px solid var(--gold);color:var(--gold);padding:.5em 1.2em;border-radius:2em;font-weight:800;pointer-events:none;animation:toast 1.8s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
.itm{position:relative;display:inline-grid;place-items:center;width:3.3em;height:3.3em;border-radius:.3em;font-size:1.6em;background:linear-gradient(#b8862b,#6b4510);border:2px solid #ffd77a;vertical-align:middle}
.itm b{position:absolute;right:.15em;bottom:0;font-size:.45em;font-weight:900;text-shadow:0 0 2px #000,0 0 2px #000}
.itm.pu{background:linear-gradient(#8a49d9,#3d1b77);border-color:#d6a6ff}.itm.gr{background:linear-gradient(#38b35a,#15572a);border-color:#9effb5}.itm.bl{background:linear-gradient(#3b7fe0,#173b7a);border-color:#a9d0ff}
/* campaign map */
.parch{position:absolute;inset:0;background:
 radial-gradient(ellipse at 30% 40%,rgba(255,240,190,.55),transparent 55%),radial-gradient(ellipse at 75% 65%,rgba(255,230,170,.45),transparent 50%),
 radial-gradient(ellipse at 50% 50%,#e7c983,#c79a4f 70%,#8a6128);}
.parch::before{content:"";position:absolute;inset:0;opacity:.25;background:repeating-radial-gradient(circle at 20% 30%,transparent 0 .9em,rgba(120,80,30,.25) 1em 1.05em),repeating-linear-gradient(35deg,transparent 0 3em,rgba(110,70,20,.12) 3em 3.15em)}
.parch .sea{position:absolute;right:-6%;top:-10%;width:30%;height:130%;border-radius:40%;background:radial-gradient(ellipse at 30% 50%,#4f8fa5,#21566e);opacity:.85;filter:blur(.15em)}
.parch .deco{position:absolute;font-size:3.6em;opacity:.55;filter:sepia(.7)}
svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-85%);display:flex;flex-direction:column;align-items:center;z-index:5}
.node .ban{position:relative;width:3.6em;height:4.2em;display:grid;place-items:center;font-weight:900;font-size:1em;color:#e6e0d2;background:linear-gradient(#6b6a72,#3d3c44);clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);box-shadow:inset 0 0 0 2px #9b9aa4}
.node .ban::before{content:"";position:absolute;inset:3px;clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);background:linear-gradient(#55545c,#2d2c33)}
.node .ban span{position:relative;font-size:1.05em;margin-top:-.8em}
.node .ban i{position:absolute;bottom:.7em;font-style:normal;font-size:.75em;letter-spacing:.05em;color:#ffd23a}
.node .ped{width:4.6em;height:1.6em;margin-top:-.4em;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#bdbbc4,#6c6a74 70%);box-shadow:0 .3em .3em rgba(0,0,0,.4)}
.node.done .ban::before,.node.cur .ban::before{background:linear-gradient(#d4352c,#8a1610)}
.node.cur .ped{background:radial-gradient(ellipse at 50% 30%,#ffe596,#c78b24 70%);box-shadow:0 0 1.2em #ffc84a}
.node.boss .ban{width:4.4em;height:5em}
.node.boss .ban::before{background:linear-gradient(#5b2a7a,#2a0f3d)}
.node.lock{filter:grayscale(.6) brightness(.85)}
.node .rw{position:absolute;top:-1.9em;right:-1.4em;width:2.4em;height:2.4em;border-radius:.3em;display:grid;place-items:center;font-size:1.1em;background:#f6efe0;border:2px solid #d2b675;box-shadow:0 .15em .3em rgba(0,0,0,.4)}
.node .rw b{position:absolute;right:.05em;bottom:-.1em;font-size:.5em;color:#3a2a10}
.node .me{position:absolute;top:-4.2em;left:-1.6em;width:3.6em;height:3.6em;border-radius:50%;border:3px solid #b07cff;background:#222 center/170% no-repeat;box-shadow:0 0 .8em #7a3cff}
.chaps{position:absolute;left:50%;bottom:.6em;transform:translateX(-50%);display:flex;align-items:center;gap:.4em;z-index:10}
.chaps button{width:2.8em;height:2.8em;transform:rotate(45deg);display:grid;place-items:center;background:linear-gradient(135deg,#fff6db,#d9b56a);border:2px solid #a07a2c;font-weight:900;color:#4a3410}
.chaps button span{transform:rotate(-45deg);font-size:1.15em}
.chaps button.on{background:linear-gradient(135deg,#fff3b0,#ffc63a);box-shadow:0 0 1em #ffcf4a}
.chaps button:disabled{background:linear-gradient(135deg,#e8e8ea,#a8a8b0);color:#666}
.chaps i{width:1.4em;height:2px;background:#d9b56a}
.chn{position:absolute;bottom:1.1em;font-weight:900;font-size:1.05em;color:#fff;z-index:10;display:flex;align-items:center;gap:.4em}
.starcnt{position:absolute;right:calc(1.3em + var(--sr));bottom:3.5em;z-index:10;font-weight:900;font-size:1.1em;display:flex;flex-direction:column;align-items:center}
.starcnt .d{width:2.8em;height:2.8em;transform:rotate(45deg);display:grid;place-items:center;background:linear-gradient(135deg,#6a3fd1,#2a1458);border:2px solid #e7c26a}
.starcnt .d span{transform:rotate(-45deg);color:#ff8ad6}
/* formation VS */
.vs{position:absolute;inset:0;background:linear-gradient(90deg,#173a86,#1d2f6a 45%,#4b1d4a 55%,#7a1f3c)}
.vs::after{content:"";position:absolute;left:0;right:0;bottom:0;height:11.4em;background:linear-gradient(#1a1d2b,#11131c);border-top:1px solid #3b3f55}
.side{position:absolute;top:3.3em;width:41%;z-index:2}
.side.l{left:2%}.side.r{right:2%}
.pwbar{display:flex;align-items:center;gap:.5em;height:2.6em;padding:0 1em;font-size:1.35em;font-weight:900;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.2));border:1px solid rgba(255,255,255,.12)}
.side.l .pwbar{clip-path:polygon(0 0,95% 0,100% 50%,95% 100%,0 100%);justify-content:flex-end}
.side.r .pwbar{clip-path:polygon(5% 0,100% 0,100% 100%,5% 100%,0 50%)}
.slots{display:grid;grid-template-columns:repeat(3,4.6em);gap:.5em;justify-content:center;margin-top:.5em}
.slots .pc{width:4.6em}
.slots .empty{width:4.6em;aspect-ratio:4/5;border:2px dashed rgba(255,255,255,.25);border-radius:.3em;display:grid;place-items:center;color:rgba(255,255,255,.3);font-size:1.6em}
.slots .row2{grid-column:1/-1;display:flex;justify-content:center;gap:.6em}
.vsmid{position:absolute;left:50%;top:5.5em;transform:translateX(-50%);z-index:3;text-align:center;width:20%}
.vsmid .V{font-size:4.2em;font-weight:900;font-style:italic;letter-spacing:-.05em;background:linear-gradient(#fff7d8,#f2c057 55%,#b07418);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .1em .1em #000)}
.vsmid .s3{font-size:1.9em;color:#9aa0ad;letter-spacing:.15em}
.vsmid ul{list-style:none;padding:0;margin:.3em 0 0;text-align:left;font-size:.8em;font-weight:700}
.vsmid li::before{content:"◆ ";color:var(--gold)}
.roster{position:absolute;left:calc(5em + var(--sl));right:16em;bottom:.5em;height:10.6em;overflow-x:auto;overflow-y:hidden;z-index:3;display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,5.1em);grid-auto-columns:4.1em;gap:.35em}
.roster .pc{height:5.1em;width:4.1em}
.fbtns{position:absolute;right:calc(1em + var(--sr));bottom:.7em;width:14em;z-index:3;display:flex;flex-direction:column;gap:.5em}
.fbtns .gold{width:100%;font-size:1.5em;padding:.4em 0}
.ftabs{position:absolute;left:calc(1.2em + var(--sl));bottom:1em;z-index:3;display:flex;flex-direction:column;gap:.6em}
.ftabs button{width:2.8em;height:2.8em;transform:rotate(45deg);background:linear-gradient(135deg,#3a3020,#141008);border:2px solid #a08040}
.ftabs button span{display:block;transform:rotate(-45deg);font-size:1.2em}
/* battle */
#bt .bg{filter:brightness(.95) saturate(1.1)}
.fig .sprite{filter:brightness(1.15)}
#bt .floor{position:absolute;left:-20%;right:-20%;bottom:-30%;height:85%;transform:perspective(40em) rotateX(62deg);transform-origin:50% 100%;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9%),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12%),radial-gradient(ellipse at 50% 30%,rgba(255,200,140,.25),rgba(40,20,10,.8) 70%);mix-blend-mode:overlay}
#bt .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 50%,rgba(0,0,0,.55))}
