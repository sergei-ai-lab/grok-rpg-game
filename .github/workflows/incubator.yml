name: Dragon incubator
on:
  pull_request:
    branches: [main]
    paths: ['bot/**', 'public/flock/**', '.github/workflows/incubator.yml']
  push:
    branches: [main]
    paths: ['bot/**', 'public/flock/**', '.github/workflows/incubator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: bot
      - run: npm test
        working-directory: bot
